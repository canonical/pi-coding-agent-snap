name: pi-coding-agent
base: core26
title: Pi Coding Agent
summary: Minimal extensible coding agent for the terminal
description: |
  Pi is a minimal terminal coding harness. Adapt pi to your workflows,
  not the other way around, without having to fork and modify pi internals.

  Extend it with TypeScript Extensions, Skills, Prompt Templates, and Themes.
  Pi ships with powerful defaults but skips features like sub agents and
  plan mode. Instead, you can ask pi to build what you want or install a
  third party pi package that matches your workflow.

  This snap bundles a Node.js runtime and runs pi's plain JavaScript CLI,
  built from the upstream pi repository. Bundling Node.js means no host
  Node.js install is required.

  The optional pi-acp component (https://github.com/svkozak/pi-acp) is an
  Agent Client Protocol (ACP) adapter that lets ACP clients such as the
  Zed editor drive pi. Install it with
  `sudo snap install pi-coding-agent+pi-acp` and configure your client
  to run `pi-coding-agent.pi-acp`.

  The snap packaging is maintained separately at
  https://github.com/canonical/pi-coding-agent-snap
license: MIT AND Apache-2.0
contact: https://github.com/canonical/pi-coding-agent-snap/issues
website: https://pi.dev
source-code: https://github.com/earendil-works/pi
issues: https://github.com/canonical/pi-coding-agent-snap/issues
adopt-info: pi-build
assumes: [snapd2.76]

grade: stable
confinement: classic

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]
  riscv64:
    build-on: [riscv64]
    build-for: [riscv64]

apps:
  pi-coding-agent:
    command: bin/pi.wrapper
    completer: usr/share/bash-completion/completions/pi-coding-agent.completion
  pi:
    command: bin/pi.wrapper
    completer: usr/share/bash-completion/completions/pi.completion
  # Apps cannot live in a component; pi-acp.wrapper runs the adapter from
  # the pi-acp component and explains how to install it when it is absent.
  pi-acp:
    command: bin/pi-acp.wrapper
  # Likewise for pi-gondolin: the extension and the gondolin library live in
  # the gondolin component.
  pi-gondolin:
    command: bin/pi-gondolin.wrapper

components:
  pi-acp:
    type: standard
    # Static, not adopt-info: craftctl rejects the hyphen in
    # `components.pi-acp.version`. Renovate bumps this together with the
    # pi-acp part's source-tag; keep it directly after `type`.
    version: "0.0.34"
    summary: ACP adapter for pi
    description: |
      pi-acp (https://github.com/svkozak/pi-acp) speaks the Agent Client
      Protocol (ACP) on stdio so ACP clients such as the Zed editor can
      drive pi. Run it as `pi-coding-agent.pi-acp`.
  gondolin:
    type: standard
    # adopt-info lets the gondolin-extension part set this from the version of
    # the gondolin package it installs.
    adopt-info: gondolin-extension
    summary: Gondolin micro-VM sandbox for pi's built-in tools
    description: |
      Run pi's built-in tools (read, write, edit, bash, grep, find, ls) and
      user `!` commands inside a local Linux micro-VM instead of on the host.
      The directory pi was started in is mounted at /workspace in the guest;
      other guest filesystem changes stay inside the VM.

      The micro-VM is booted with the host QEMU installation (qemu-system-* and
      qemu-img), so QEMU must be installed separately. Guest images (~330 MiB)
      are downloaded on first use and cached in ~/.cache/gondolin.

      Install with `snap install pi-coding-agent+gondolin` and launch with
      `pi-gondolin` (or `pi-coding-agent.pi-gondolin`).

parts:
  # ============================================================
  # Node.js — build-time toolchain (npm workspace + TypeScript
  # compilation) and the runtime `node` binary bundled in the snap
  # ============================================================
  nodejs:
    plugin: nil
    build-packages:
      - curl
      - xz-utils
    override-build: |
      NODE_VERSION="v22.23.1"
      NODE_BASE="https://nodejs.org/dist"
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          NODE_ARCH="x64"
          ;;
        arm64)
          NODE_ARCH="arm64"
          ;;
        riscv64)
          # RISC-V currently has no official builds, so we use unofficial ones instead for now
          NODE_BASE="https://unofficial-builds.nodejs.org/download/release"
          NODE_ARCH="riscv64"
          ;;
      esac

      NODE_URL="$NODE_BASE/$NODE_VERSION/node-$NODE_VERSION-linux-$NODE_ARCH.tar.xz"
      echo "Downloading Node.js from $NODE_URL"
      curl -fsSL "$NODE_URL" -o /tmp/node.tar.xz
      tar -xf /tmp/node.tar.xz -C /tmp

      # Build-time toolchain: node/npm/npx on PATH for the pi-build part,
      # which runs later in the same build environment.
      echo "Installing Node.js build toolchain to /usr/local"
      cp -r /tmp/node-v*/bin/* /usr/local/bin/
      cp -r /tmp/node-v*/lib/node_modules /usr/local/lib/

      # Runtime payload: pi runs as a plain Node.js CLI. Bundle the
      # `node` executable itself so pi.wrapper can run it without
      # depending on a host Node.js install.
      echo "Staging node runtime into the snap payload"
      mkdir -p "${CRAFT_PART_INSTALL}/node/bin"
      cp /tmp/node-v*/bin/node "${CRAFT_PART_INSTALL}/node/bin/node"

      # Ship Node.js' own LICENSE alongside the bundled runtime so the snap
      # carries the license text for the redistributed Node.js binary.
      cp /tmp/node-v*/LICENSE "${CRAFT_PART_INSTALL}/node/LICENSE"

      rm -f /tmp/node.tar.xz

  # ============================================================
  # Pi — clone upstream source, install deps, build JS CLI + assets
  # ============================================================
  pi-build:
    after:
      - nodejs
    plugin: nil
    source: https://github.com/earendil-works/pi
    source-type: git
    source-tag: v1.5.0
    build-environment:
      - PATH: "/usr/local/bin:${PATH}"
    override-build: |
      set -ex

      echo "Using node: $(node --version)"
      echo "Using npm: $(npm --version)"

      # ------------------------------------------------------------------
      # pi's git source tarball does not include generated LLM provider
      # model-data (packages/ai/src/providers/data is produced by a live
      # network call: `npm run generate-models`). To keep the snap build
      # deterministic and not dependent on live provider catalog APIs,
      # pull the exact same data already published in the matching
      # @earendil-works/pi-ai npm release — mirroring the pi AUR package's
      # PKGBUILD `prepare()` step, which does exactly this.
      # ------------------------------------------------------------------
      AI_VERSION=$(node -e "console.log(require('./packages/ai/package.json').version)")
      echo "Fetching pi-ai@${AI_VERSION} npm tarball for provider model data"
      # Use `npm pack` rather than a raw curl so npm verifies the tarball's
      # sha512 integrity against the registry's published dist.integrity metadata.
      # The version stays derived from the checked-out source-tag above so it can
      # never drift from the snap's source-tag.
      mkdir -p /tmp/pi-ai-npm-src /tmp/pi-ai-npm
      npm pack "@earendil-works/pi-ai@${AI_VERSION}" --pack-destination /tmp/pi-ai-npm-src
      tar -xzf /tmp/pi-ai-npm-src/*.tgz -C /tmp/pi-ai-npm
      rm -rf packages/ai/src/providers/data
      cp -r /tmp/pi-ai-npm/package/dist/providers/data packages/ai/src/providers/data
      rm -rf /tmp/pi-ai-npm-src /tmp/pi-ai-npm

      # ----------------------------------------------------------
      # Install workspace dependencies (build + production deps). This
      # part always builds natively (amd64-on-amd64, arm64-on-arm64; no
      # cross-compile), so npm resolves any native deps for the correct
      # arch; the pi-tui clipboard prebuild shipped below is instead
      # selected explicitly via the $CRAFT_ARCH_BUILD_FOR case there.
      # ----------------------------------------------------------
      npm ci --ignore-scripts

      # ----------------------------------------------------------
      # riscv64 only: pi pins tsgo (@typescript/native-preview) as the
      # build-time compiler, and Microsoft publishes no linux-riscv64
      # binary for it (the package has no JS fallback), so the workspace
      # "tsgo -p" build scripts cannot run as-is. Swap in the shipped
      # typescript 7 package, which does ship a linux-riscv64 binary, and
      # shim node_modules/.bin/tsgo to its tsc. The shim also passes
      # --target es2024: the shipped tsc is stricter than the pinned tsgo
      # dev build and rejects v-flag regex literals under the repo's
      # ES2022 target; the emitted JS is equivalent (pi runs on
      # node >=22.19, which supports ES2024), and CLI flags override the
      # tsconfig target without patching any package configs.
      # ----------------------------------------------------------
      if [ "$CRAFT_ARCH_BUILD_FOR" = riscv64 ]; then
        npm install --no-save --ignore-scripts "typescript@7.0.2"
        printf '%s\n' \
          '#!/bin/sh' \
          'exec node "$(dirname "$0")"/../typescript/lib/tsc.js --target es2024 "$@"' \
          > node_modules/.bin/tsgo
        chmod +x node_modules/.bin/tsgo
      fi

      # ----------------------------------------------------------
      # Build all workspace packages with pi's plain npm pipeline.
      # build:offline reuses the model data staged above instead of
      # refreshing it from live provider catalogs.
      # ----------------------------------------------------------
      npm run build:offline

      # ----------------------------------------------------------
      # Drop devDependencies; only production deps ship in the snap.
      # ----------------------------------------------------------
      npm prune --omit=dev --ignore-scripts

      # ----------------------------------------------------------
      # Derive snap version from the coding-agent package.json
      # ----------------------------------------------------------
      PI_VERSION=$(node -e "console.log(require('./packages/coding-agent/package.json').version)")
      craftctl set version="$PI_VERSION"

      # ----------------------------------------------------------
      # Assemble the runtime payload. Layout mirrors the pi AUR package
      # (/usr/lib/node_modules/pi): node_modules/ and packages/ as
      # siblings so npm workspace symlinks inside node_modules (e.g.
      # node_modules/@earendil-works/pi-agent-core -> ../../packages/agent)
      # keep resolving correctly.
      #
      # The set of workspace packages to ship is DERIVED, not hardcoded:
      # snap/local/pi-workspace-packages.mjs follows both compiled
      # @earendil-works/* imports and production workspace dependencies
      # from coding-agent until a fixpoint. Compiled imports alone do not
      # reach every runtime package: pi-telemetry is only imported as a
      # type by pi-ai, which compiles away. npm resolves links in the
      # build tree even when their targets are omitted from the snap, so
      # `npm ci`/`npm prune` cannot catch this. Workspace packages that no
      # staged package depends on in production remain excluded.
      # ----------------------------------------------------------
      WSP_SCRIPT="${CRAFT_PROJECT_DIR}/snap/local/pi-workspace-packages.mjs"
      test -f "$WSP_SCRIPT" || {
        echo "ERROR: cannot find $WSP_SCRIPT" >&2
        exit 1
      }
      PACKAGES_TO_COPY="$(node "$WSP_SCRIPT")"
      printf '%s\n' "$PACKAGES_TO_COPY" | grep -qx coding-agent || {
        echo "ERROR: pi-workspace-packages.mjs failed to derive the runtime workspace set" >&2
        exit 1
      }
      echo "Runtime workspace packages to ship:"
      echo "$PACKAGES_TO_COPY" | sed 's/^/  /'

      PI_HOME="${CRAFT_PART_INSTALL}/lib/pi"
      mkdir -p "${PI_HOME}/node_modules"
      cp -a node_modules/. "${PI_HOME}/node_modules/"
      rm -rf "${PI_HOME}/node_modules/koffi"   # Windows-only clipboard helper

      # npm hoists @earendil-works/gondolin (+ its ~20 MiB krun runner) from
      # pi's example workspace into root node_modules; no shipped package needs
      # it. The gondolin component owns that payload.
      rm -rf "${PI_HOME}/node_modules/@earendil-works/gondolin" \
             "${PI_HOME}"/node_modules/@earendil-works/gondolin-krun-runner-*

      # Ship pi's LICENSE (MIT, copyright earendil-works) next to the
      # bundled packages so the snap carries the upstream license text.
      cp LICENSE "${PI_HOME}/LICENSE"

      for pkg in $PACKAGES_TO_COPY; do
        [ "$pkg" = "coding-agent" ] && continue   # handled below (extra docs/examples)
        mkdir -p "${PI_HOME}/packages/${pkg}"
        cp -a "packages/${pkg}/dist" "packages/${pkg}/package.json" "packages/${pkg}/README.md" \
          "${PI_HOME}/packages/${pkg}/"
      done

      # ----------------------------------------------------------
      # X11 clipboard image reading is a native prebuild bundled inside
      # @earendil-works/pi-tui, loaded at runtime from
      # packages/tui/native/... relative to the installed
      # package directory — never from dist/. The copy loop above only
      # ships dist/package.json/README.md, so without this the helper
      # would silently fail to load (no build error, no crash — just no
      # X11 image-paste). Ship only the Linux prebuild for the arch this
      # part is building for; darwin/win32 native subtrees and headers
      # are dead weight in a Linux snap.
      # ----------------------------------------------------------
      if printf '%s\n' "$PACKAGES_TO_COPY" | grep -qx tui; then
        case "$CRAFT_ARCH_BUILD_FOR" in
          amd64)
            _TUI_NATIVE_ARCH=x64
            ;;
          arm64)
            _TUI_NATIVE_ARCH=arm64
            ;;
          riscv64)
            # pi-tui ships no riscv64 prebuild and its loader only knows
            # x64/arm64; pi falls back to command-line clipboard tools
            # (wl-clipboard ships in this snap). Nothing to copy.
            ;;
        esac
        if [ -n "${_TUI_NATIVE_ARCH:-}" ]; then
          _TUI_NATIVE_NODE="packages/tui/native/linux/prebuilds/linux-${_TUI_NATIVE_ARCH}/linux-platform-x11.node"
          echo "Verifying pi-tui native clipboard helper: $_TUI_NATIVE_NODE"
          test -f "$_TUI_NATIVE_NODE" || {
            echo "ERROR: pi-tui native clipboard helper not found: $_TUI_NATIVE_NODE" >&2
            echo "       upstream pi-tui packaging may have changed; update this copy step." >&2
            exit 1
          }
          mkdir -p "${PI_HOME}/packages/tui/native/linux/prebuilds/linux-${_TUI_NATIVE_ARCH}"
          cp -a "$_TUI_NATIVE_NODE" "${PI_HOME}/packages/tui/native/linux/prebuilds/linux-${_TUI_NATIVE_ARCH}/"
        fi
      fi

      # node_modules/ links every workspace package via npm, not just the
      # ones in the runtime closure. Drop symlinks whose target package
      # was not shipped so the payload has no dead build-only references.
      # The smoke test checks that no production workspace dependency was
      # dropped. Run before coding-agent is
      # copied: that also removes its now-dangling workspace link and
      # .bin/pi (which points into dist/bundle, stripped below).
      find "${PI_HOME}" -type l ! -exec test -e {} \; -delete

      mkdir -p "${PI_HOME}/packages/coding-agent"
      cp -a packages/coding-agent/dist packages/coding-agent/docs packages/coding-agent/examples \
        packages/coding-agent/package.json packages/coding-agent/README.md packages/coding-agent/CHANGELOG.md \
        "${PI_HOME}/packages/coding-agent/"

      # npm nests a production dep under a workspace package's own
      # node_modules/ when the root has an incompatible version. Node
      # resolves those from packages/<pkg>/node_modules, so ship them too.
      for pkg in $PACKAGES_TO_COPY; do
        if [ -d "packages/${pkg}/node_modules" ]; then
          cp -a "packages/${pkg}/node_modules" "${PI_HOME}/packages/${pkg}/"
        fi
      done

      # ----------------------------------------------------------
      # Strip build artifacts that are never loaded at runtime.
      #
      # - *.map / *.d.ts / *.d.mts / *.d.cts: source maps + type
      #   declarations. The bundled node runtime does not enable source
      #   maps (backtraces already resolve to the compiled .js files) and
      #   type declarations are only needed by consumers doing their own
      #   type-checking. Together they account for ~10 MiB of the snap.
      # - dist/bundle/: the bundled CLI variant (created by
      #   scripts/build-coding-agent-bundle.mjs). pi.wrapper execs
      #   packages/coding-agent/dist/cli.js directly, so the bundled
      #   duplicate (~1.5 MiB) is dead weight.
      # ----------------------------------------------------------
      find "${PI_HOME}" -type f \( \
          -name '*.map' -o -name '*.d.ts' -o -name '*.d.mts' -o -name '*.d.cts' \
      \) -delete
      rm -rf "${PI_HOME}/packages/coding-agent/dist/bundle"

  # ============================================================
  # pi-acp — ACP adapter for pi, built from source with the same
  # Node.js toolchain into the pi-acp component, and run by
  # pi-acp.wrapper (in the snap) with the bundled node
  # ============================================================
  pi-acp:
    after:
      - nodejs
    plugin: nil
    source: https://github.com/svkozak/pi-acp
    source-type: git
    source-tag: v0.0.34
    build-environment:
      - PATH: "/usr/local/bin:${PATH}"
    override-build: |
      set -ex

      # tsup bundles src/ into a single dist/index.js; its esbuild and
      # rollup native binaries come from per-platform optional deps in
      # the lockfile (including linux-riscv64), so no install scripts
      # are needed.
      npm ci --ignore-scripts
      npm run build
      npm prune --omit=dev --ignore-scripts

      # The adapter locates its package.json by walking up from
      # dist/index.js (for the ACP agentInfo version), so keep the npm
      # package layout; organize below makes it the component root.
      # Ship pi-acp's LICENSE (MIT, Sergii Kozak).
      PI_ACP_HOME="${CRAFT_PART_INSTALL}/pi-acp"
      mkdir -p "${PI_ACP_HOME}"
      cp -a dist node_modules package.json README.md LICENSE "${PI_ACP_HOME}/"

      # Same runtime-unused artifacts stripped from lib/pi in pi-build.
      find "${PI_ACP_HOME}" -type f \( \
          -name '*.map' -o -name '*.d.ts' -o -name '*.d.mts' -o -name '*.d.cts' \
      \) -delete
    organize:
      pi-acp: (component/pi-acp)

  # ============================================================
  # Gondolin — optional component payload: pi's upstream
  # tool-routing extension plus the gondolin library it imports
  # ============================================================
  gondolin-extension:
    after:
      - nodejs
      - pi-build
    plugin: nil
    source: snap/local/gondolin-extension
    build-environment:
      - PATH: "/usr/local/bin:${PATH}"
    override-build: |
      set -ex

      # Entry point from the pi checkout staged by pi-build, so it matches this
      # pi release. The dependency set is pinned here, not taken from pi's
      # example: it is reviewed like any other pinned dep and stays reproducible.
      EXT_SRC="${CRAFT_STAGE}/lib/pi/packages/coding-agent/examples/extensions/gondolin/index.ts"
      test -f "$EXT_SRC" || {
        echo "ERROR: staged pi gondolin extension not found: $EXT_SRC" >&2
        echo "       pi-build must keep staging packages/coding-agent/examples." >&2
        exit 1
      }

      EXT_OUT="${CRAFT_PART_INSTALL}/lib/pi-gondolin"
      mkdir -p "$EXT_OUT"
      install -m 644 "$EXT_SRC" "$EXT_OUT/index.ts"
      install -m 644 "$CRAFT_PART_SRC/package.json" \
        "$CRAFT_PART_SRC/package-lock.json" \
        "$EXT_OUT/"

      # --omit=optional skips the krun runner (~20 MiB native, needs libkrun);
      # qemu is the backend. --ignore-scripts keeps the install to file copies.
      (
        cd "$EXT_OUT"
        npm ci --omit=dev --omit=optional --ignore-scripts --no-audit --no-fund
      )

      # Match lib/pi's lean payload: maps and type declarations are not loaded.
      find "$EXT_OUT" -type f \( -name '*.map' -o -name '*.d.ts' \) -delete

      # The extension comes from pi, so a gondolin version mismatch may mean an
      # API mismatch. Surface it in the build log.
      PINNED=$(node -p "require('$CRAFT_STAGE/lib/pi/packages/coding-agent/examples/extensions/gondolin/package.json').dependencies['@earendil-works/gondolin']")
      INSTALLED=$(node -p "require('$EXT_OUT/node_modules/@earendil-works/gondolin/package.json').version")
      if [ "$PINNED" != "$INSTALLED" ]; then
        echo "WARNING: pi pins gondolin $PINNED, this component ships $INSTALLED" >&2
        echo "         check the extension API, then update snap/local/gondolin-extension" >&2
      fi

      # Component version, adopted by `adopt-info` above. craftctl rejects
      # hyphens in component names, which is why pi-acp declares its version.
      craftctl set components.gondolin.version="$INSTALLED"
    organize:
      lib/pi-gondolin: (component/gondolin)/lib/pi/extensions/gondolin

  # ============================================================
  # wl-clipboard — Wayland clipboard tools from Ubuntu package
  # Needed for clipboard support on Wayland (default display server).
  # pi uses wl-copy/wl-paste on Wayland; falls back to xclip otherwise.
  # ============================================================
  wl-clipboard:
    after:
      - pi-build
    plugin: nil
    stage-packages:
      - wl-clipboard
    stage:
      - usr/bin/wl-copy
      - usr/bin/wl-paste
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libwayland-client.so.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libwayland-client.so.0.*
    build-packages:
      - patchelf
    override-build: |
      craftctl default
      # core26 ships the dynamic loader in /lib64 only on amd64
      # (Ubuntu multiarch convention). arm64 and riscv64 have no lib64/
      # directory at all: the loader lives at /lib/ld-linux-*.so.* via
      # lib -> usr/lib. Pointing wl-copy/wl-paste at lib64 there yields
      # binaries that fail to exec with ENOENT (verified against core26
      # rev 463 arm64 / rev 466 riscv64: no lib64/ entry in either).
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          _LDNAME=ld-linux-x86-64.so.2
          _LDDIR=lib64
          ;;
        arm64)
          _LDNAME=ld-linux-aarch64.so.1
          _LDDIR=lib
          ;;
        riscv64)
          _LDNAME=ld-linux-riscv64-lp64d.so.1
          _LDDIR=lib
          ;;
      esac
      _RPATH='$ORIGIN/../lib/'"$CRAFT_ARCH_TRIPLET_BUILD_FOR"':/snap/core26/current/lib/'"$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      patchelf \
        --set-interpreter "/snap/core26/current/${_LDDIR}/$_LDNAME" \
        --set-rpath "$_RPATH" \
        $CRAFT_PART_INSTALL/usr/bin/wl-copy \
        $CRAFT_PART_INSTALL/usr/bin/wl-paste
      patchelf \
        --set-rpath /snap/core26/current/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR \
        $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libwayland-client.so.0.*

  # ============================================================
  # Configuration — wrapper scripts, pi shim, bash completion
  # ============================================================
  pi-configuration:
    after:
      - pi-build
    plugin: nil
    source: snap/local
    override-build: |
      install -Dm644 "$CRAFT_PART_SRC"/node-exec.sh \
        "$CRAFT_PART_INSTALL"/bin/node-exec.sh
      install -Dm755 "$CRAFT_PART_SRC"/pi.wrapper \
        "$CRAFT_PART_INSTALL"/bin/pi.wrapper
      install -Dm755 "$CRAFT_PART_SRC"/pi-acp.wrapper \
        "$CRAFT_PART_INSTALL"/bin/pi-acp.wrapper
      install -Dm755 "$CRAFT_PART_SRC"/pi.shim \
        "$CRAFT_PART_INSTALL"/lib/pi/packages/coding-agent/bin/pi
      install -Dm755 "$CRAFT_PART_SRC"/pi-gondolin.wrapper \
        "$CRAFT_PART_INSTALL"/bin/pi-gondolin.wrapper
      install -Dm644 "$CRAFT_PART_SRC"/pi.completion \
        "$CRAFT_PART_INSTALL"/usr/share/bash-completion/completions/pi.completion
      install -Dm644 "$CRAFT_PART_SRC"/pi.completion \
        "$CRAFT_PART_INSTALL"/usr/share/bash-completion/completions/pi-coding-agent.completion
